[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-guardrail-lab"
version = "0.2.0"
description = "A defensive, plugin-based prompt-injection regression test harness for LLMs and GenAI applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Arjun Arjun"}]
keywords = ["llm-security", "prompt-injection", "red-team", "rag-security", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.7,<1",
  "build>=1.2,<2",
]

[project.scripts]
guardrail-lab = "genai_guardrail_lab.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
